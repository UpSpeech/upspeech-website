[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Deploy previews run the same command as production. They used to skip the
# prerender step, on the basis that Netlify CI had no Chrome, but the production
# build installs its own (`npx puppeteer browsers install chrome` in the build
# script) and prerenders 66 pages on this same image every deploy.
#
# Skipping it meant a preview served a ~10KB SPA shell where production serves
# ~124KB of prerendered HTML, so a green preview check proved nothing about the
# step most likely to fail. Netlify posts statuses on previews but not on
# production branch builds, so a production build that died in prerender showed
# up nowhere: the PR went green, the merge commit reported no checks at all, and
# the deploy silently stayed on the previous build. Previews take longer now,
# which is the point.

[[redirects]]
  from = "https://upspeechapp.com/*"
  to = "https://upspeech.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://upspeechapp.com/*"
  to = "https://upspeech.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.upspeechapp.com/*"
  to = "https://upspeech.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.upspeechapp.com/*"
  to = "https://upspeech.app/:splat"
  status = 301
  force = true

# Mobile-app deep-link redirect. Mobile intercepts via Universal Links / App
# Links before the 302 fires; web users fall through to the tenant SPA. See
# decisions/2026-05-18-apex-deep-link-redirect.md.
[[redirects]]
  from = "/r/:tenant/*"
  to = "https://:tenant.upspeech.app/:splat"
  status = 302
  force = true

# Same redirect for the bare `/r/<tenant>` form (no trailing path or splat).
[[redirects]]
  from = "/r/:tenant"
  to = "https://:tenant.upspeech.app/"
  status = 302
  force = true

# PostHog same-origin tunnel. Ad-blockers and Firefox tracking protection drop
# requests to eu.i.posthog.com by domain, so ~20-30% of visitors send no
# analytics at all. Proxying through a same-origin, filter-neutral path recovers
# core events and pageviews for those users. Session replay and dead-click
# autocapture stay blocked regardless (uBlock matches those filenames, not the
# host), so this only buys back the basic analytics. The SDK points api_host at
# /relay-Qz4t in src/lib/analytics.ts. Must precede the /* SPA fallback.
[[redirects]]
  from = "/relay-Qz4t/static/*"
  to = "https://eu-assets.i.posthog.com/static/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/relay-Qz4t/*"
  to = "https://eu.i.posthog.com/:splat"
  status = 200
  force = true

# Renamed page: /stutter-positive is now /person-centered-therapy.
# Both old spellings point straight at the final URL so there is no 301 chain.
# These live here rather than in a _redirects file: the publish directory is
# `dist`, and a root-level _redirects is never copied there by Vite, so its
# rules never reach Netlify. netlify.toml is the single source of truth.
[[redirects]]
  from = "/stutter-positive"
  to = "/person-centered-therapy"
  status = 301
  force = true

[[redirects]]
  from = "/pt/stutter-positive"
  to = "/pt/person-centered-therapy"
  status = 301
  force = true

[[redirects]]
  from = "/es/stutter-positive"
  to = "/es/person-centered-therapy"
  status = 301
  force = true

[[redirects]]
  from = "/person-centred-therapy"
  to = "/person-centered-therapy"
  status = 301
  force = true

[[redirects]]
  from = "/pt/person-centred-therapy"
  to = "/pt/person-centered-therapy"
  status = 301
  force = true

[[redirects]]
  from = "/es/person-centred-therapy"
  to = "/es/person-centered-therapy"
  status = 301
  force = true

# No SPA fallback on purpose.
#
# There used to be a "/* -> /index.html 200" rule here, which meant every URL on
# the host answered 200 with the home page: /nope, /deep/fake/path and
# /BingSiteAuth.xml all returned the same 107KB of home page HTML. React swapped
# in the NotFound page after hydration, but the status code stayed 200 and the
# HTML a crawler reads never changed. Bing indexed the site and then stopped
# serving it, with URL Inspection reporting "known to Bing but has some issues
# which are preventing us from serving it to our users".
#
# Nothing needs the fallback: scripts/prerender.mjs writes a real
# dist/<route>/index.html for all 66 routes and scripts/check-routes.mjs fails
# the build if App.tsx and scripts/routes.mjs ever disagree about that list. So
# a request that matches no file is genuinely a missing page, and Netlify
# answers it with dist/404.html under a 404, which prerender.mjs now writes.
#
# The redirects above still take precedence, so the PostHog relay and the
# /r/:tenant deep link are unaffected.

# Custom headers for SEO, security, and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Mirrors the <meta> CSP in index.html, promoted to a real response header
    # so frame-ancestors and form-action are enforced (a <meta> CSP cannot set
    # them). frame-ancestors 'none' matches X-Frame-Options: DENY above.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://www.googletagmanager.com https://*.clarity.ms https://c.bing.com https://eu-assets.i.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.clarity.ms; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com https://upspeech.app https://c.bing.com https://*.clarity.ms; connect-src 'self' http://localhost:3050 https://app-backend-production-f30a.up.railway.app https://*.google-analytics.com https://analytics.google.com https://www.googletagmanager.com https://*.clarity.ms https://c.bing.com https://eu.i.posthog.com https://eu-assets.i.posthog.com; script-src-elem 'self' 'unsafe-inline' https://www.googletagmanager.com https://*.clarity.ms https://eu-assets.i.posthog.com; frame-ancestors 'none'; form-action 'self'"

# Universal Links / Android App Links manifests.
# AASA has no file extension; force application/json so iOS accepts it.
# See decisions/2026-05-18-apex-deep-link-redirect.md.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=86400"

# Vite content-hashes everything under /assets, so a changed file gets a new
# URL and immutable is safe here.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The rest of these have STABLE filenames whose contents change on deploy, so
# immutable is wrong: replacing a file in place leaves every cache serving the
# old bytes for a year. This already bit us. /og cards are regenerated on every
# build at the same URLs, and the three pages that had no card at all were
# served the SPA fallback, which picked up the /og immutable header and got
# cached as HTML under a .png URL. must-revalidate keeps the bandwidth win via
# ETag while letting a replacement actually propagate.
[[headers]]
  for = "/screenshots/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# Shorter still: a social crawler should pick up a corrected card quickly.
[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts and hero media had no rule at all, so they fell through to Netlify's
# 4-hour default and every returning visitor revalidated six woff2 files and a
# 1.9MB mp4. Same stable-filename reasoning as the block above, so not immutable,
# but a month of freshness rather than an afternoon. A replaced file still
# propagates on the revalidate that follows.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, must-revalidate"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, must-revalidate"

# Ensure robots.txt and sitemap.xml are always fresh
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"
